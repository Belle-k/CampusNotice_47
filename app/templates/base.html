
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CampusNotice{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="app-shell">

    <!-- 左侧导航栏 -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-logo">CN</div>
            <div>
                <h2>CampusNotice</h2>
                <span>校园通知管理助手</span>
            </div>
        </div>

        <div class="sidebar-label">工作空间</div>

        <nav class="nav-menu">

            <a href="{{ url_for('index') }}"
               class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                <span class="nav-icon">⌂</span>
                <span>首页概览</span>
            </a>

            <a href="{{ url_for('import_page') }}"
               class="nav-link {% if active_page == 'import' %}active{% endif %}">
                <span class="nav-icon">＋</span>
                <span>通知导入</span>
            </a>

            <a href="{{ url_for('notices_page') }}"
               class="nav-link {% if active_page == 'notices' %}active{% endif %}">
                <span class="nav-icon">▤</span>
                <span>通知管理</span>
            </a>

            <a href="{{ url_for('calendar_page') }}"
               class="nav-link {% if active_page == 'calendar' %}active{% endif %}">
                <span class="nav-icon">▦</span>
                <span>截止日历</span>
            </a>

            <a href="{{ url_for('statistics_page') }}"
               class="nav-link {% if active_page == 'statistics' %}active{% endif %}">
                <span class="nav-icon">▥</span>
                <span>数据统计</span>
            </a>

        </nav>

        <div class="sidebar-bottom">
            <div class="help-card">
                <div class="help-icon">?</div>
                <strong>项目介绍</strong>
                <p>让校园通知管理更加简单。</p>
                <span>CampusNotice V1.0</span>
            </div>
        </div>

    </aside>


    <!-- 右侧主体区域 -->
    <div class="main-area">

        <header class="topbar">

            <div class="breadcrumb">
                工作空间
                <span>/</span>
                <strong>{% block page_heading %}首页概览{% endblock %}</strong>
            </div>

            <div class="topbar-right">
                <span class="system-status">
                    <span class="status-dot"></span>
                    本地运行中
                </span>

                <div class="user-avatar">47</div>
            </div>

        </header>


        <main class="main-content">

            {% block content %}
            {% endblock %}

        </main>


        <footer class="footer">
            CampusNotice © 2026
            <span>校园通知智能管理助手</span>
        </footer>

    </div>

</div>

</body>
</html>
