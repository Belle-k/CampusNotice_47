<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusNotice - 校园通知智能管理助手</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background: #f4f6fa;
            color: #263445;
        }

        header {
            background: #ffffff;
            padding: 22px 40px;
            border-bottom: 1px solid #e5eaf0;
        }

        header h2 {
            margin: 0;
            color: #2563eb;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .welcome {
            background: #2563eb;
            color: white;
            padding: 32px;
            border-radius: 14px;
        }

        .welcome h1 {
            margin-top: 0;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 28px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000008;
        }

        .card h3 {
            color: #64748b;
            font-size: 15px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        footer {
            text-align: center;
            color: #94a3b8;
            margin-top: 60px;
        }

        @media (max-width: 650px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>CampusNotice</h2>
</header>

<main>

    <section class="welcome">
        <h1>校园通知智能管理助手</h1>
        <p>让校园通知更清晰，让重要事项不再遗漏。</p>
        <p>集中管理通知，智能提取信息，轻松掌握截止日期。</p>
    </section>

    <section class="cards">

        <div class="card">
            <h3>通知总数</h3>
            <div class="number">0</div>
            <p>已收集的校园通知</p>
        </div>

        <div class="card">
            <h3>待处理事项</h3>
            <div class="number">0</div>
            <p>等待完成的任务</p>
        </div>

        <div class="card">
            <h3>即将截止</h3>
            <div class="number">0</div>
            <p>需要关注的事项</p>
        </div>

    </section>

    <footer>
        CampusNotice V1.0 | 校园通知智能管理助手
    </footer>

</main>

</body>
</html>
